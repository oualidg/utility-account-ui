<mat-sidenav-container class="shell-container">

  <mat-sidenav mode="side" opened class="shell-sidenav">
    <div class="shell-logo" routerLink="/home">
      <mat-icon>bolt</mat-icon>
      <span>Utility Account</span>
    </div>

    <mat-nav-list>
      @for (item of navItems; track item.route) {
        @if (!item.adminOnly || authService.isAdmin()) {
          <a mat-list-item
             [routerLink]="item.route"
             routerLinkActive="active-link">
            <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
            <span matListItemTitle>{{ item.label }}</span>
          </a>
        }
      }
    </mat-nav-list>

    <div class="shell-footer">
      <div class="shell-user">
        <mat-icon>account_circle</mat-icon>
        <div class="shell-user-info">
          <span class="shell-user-name">{{ authService.currentUser()?.firstName }} {{ authService.currentUser()?.lastName }}</span>
          <span class="shell-user-role">{{ authService.currentUser()?.role }}</span>
        </div>
      </div>
      <button mat-icon-button (click)="openChangePassword()" matTooltip="Change Password">
        <mat-icon>key</mat-icon>
      </button>
      <button mat-icon-button (click)="logout()" matTooltip="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    </div>

  </mat-sidenav>

  <mat-sidenav-content class="shell-content">
    <div class="shell-page">
      <router-outlet />
    </div>
  </mat-sidenav-content>

</mat-sidenav-container>
